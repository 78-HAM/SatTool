name: DVB TS and UDP regression

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S src-testing/dvb_ts -B build-dvb-ts -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-dvb-ts --config Release
      - name: Test TS continuity and UDP output
        run: ctest --test-dir build-dvb-ts -C Release --output-on-failure
