name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Update apt cache (with retries for transient repository errors)
        run: |
          sudo apt-get update || (sleep 15 && sudo apt-get update) || (sleep 30 && sudo apt-get update)

      - name: Install dependencies
        run: |
          sudo apt-get install -y git build-essential cmake g++ pkgconf libfftw3-dev libpng-dev \
            libtiff-dev libjemalloc-dev libcurl4-openssl-dev libvolk-dev libnng-dev \
            libglfw3-dev zenity portaudio19-dev libzstd-dev libhdf5-dev librtlsdr-dev \
            libhackrf-dev libairspy-dev libairspyhf-dev libad9361-dev libiio-dev \
            libbladerf-dev libomp-dev ocl-icd-opencl-dev libdbus-1-dev libarmadillo-dev \
            libsqlite3-dev liblimesuite-dev libuhd-dev libxrandr-dev gettext python3

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DENABLE_I18N=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify i18n catalogs are up-to-date
        run: |
          msgfmt --check resources/i18n/zh_CN/LC_MESSAGES/zh_CN.po -o /dev/null
          python3 tools/gen_zh_i18n.py
          git diff --exit-code -- resources/i18n/zh_CN || (echo "zh_CN catalogs are out of date! Run: python3 tools/gen_zh_i18n.py" && exit 1)

      - name: Run UI and i18n regression tests
        run: |
          python3 tools/verify_sattool_branding.py
          python3 tools/verify_windows_release_config.py
          g++ -std=c++17 -Isrc-core src-testing/ui_regression_tests.cpp -o /tmp/ui_regression_tests
          /tmp/ui_regression_tests
          g++ -std=c++17 -D__ANDROID__ -Isrc-core \
            src-testing/i18n_switch_test.cpp src-core/libs/libintl-tiny/libintl.cpp \
            -o /tmp/i18n_switch_test
          /tmp/i18n_switch_test
          g++ -std=c++17 -Isrc-core src-testing/cjk_font_test.cpp \
            src-core/imgui/imgui.cpp src-core/imgui/imgui_draw.cpp \
            src-core/imgui/imgui_tables.cpp src-core/imgui/imgui_widgets.cpp \
            -o /tmp/cjk_font_test
          /tmp/cjk_font_test

      - name: Package install tree and DEB
        run: |
          staging="$RUNNER_TEMP/sattool-linux"
          cmake --install build --config Release --prefix "$staging/usr" > /tmp/install.log 2>&1 || { tail -50 /tmp/install.log; exit 1; }
          test -x "$staging/usr/bin/sattool-ui"
          test -x "$staging/usr/bin/sattool"
          test -f "$staging/usr/share/sattool/sattool_cfg.json"
          test -f "$staging/usr/share/sattool/resources/i18n/zh_CN/LC_MESSAGES/sattool.mo"
          test -f "$staging/usr/share/sattool/resources/fonts/NotoSansSC-Regular.otf"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf dist/SatTool-V0.0.1-Linux-install-tree.tar.gz sattool-linux
          cmake --build build --target package -j$(nproc)
          find build -maxdepth 1 -type f -name '*.deb' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: sattool-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache complete Windows dependencies
        uses: actions/cache@v4
        id: windows-deps
        with:
          path: vcpkg
          key: sattool-windows-complete-v3-${{ hashFiles('windows/Configure-vcpkg.ps1') }}

      - name: Set up MSBuild and Python
        if: steps.windows-deps.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2

      - uses: actions/setup-python@v5
        if: steps.windows-deps.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'

      - name: Install build helpers
        if: steps.windows-deps.outputs.cache-hit != 'true'
        run: pip install mako

      - name: Build complete Windows SDR dependencies
        if: steps.windows-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\windows\Configure-vcpkg.ps1 -platform x64-windows

      - name: Configure CMake
        run: >
          cmake -B build
          -DBUILD_MSVC=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -A x64
          -DBUILD_GUI=ON
          -DENABLE_I18N=ON
          -DPLUGINS_ALL=ON
          -DPLUGIN_AARONIA_SDR_SUPPORT=OFF
          -DPLUGIN_HAROGIC_SDR_SUPPORT=OFF
          -DPLUGIN_LITEXM2SDR_SDR_SUPPORT=OFF
          -DPLUGIN_RTAUDIO_SDR_SUPPORT=OFF
          -DPLUGIN_SDDC_SDR_SUPPORT=ON
          -DPLUGIN_SOAPY_SDR_SUPPORT=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Add Visual Studio binary tools to PATH
        shell: pwsh
        run: |
          $msvc = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
          "$($msvc.FullName)\bin\Hostx64\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Stage and verify Windows release
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "sattool-windows"
          cmake --install build --config Release --prefix $staging

          .\windows\Verify-WindowsRelease.ps1 -StagingPath $staging

          Push-Location $env:RUNNER_TEMP
          try {
            & (Join-Path $staging "bin\sattool.exe") --help
            if ($LASTEXITCODE -ne 0) { throw "Installed sattool.exe smoke test failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $gui = Start-Process (Join-Path $staging "bin\sattool-ui.exe") -WorkingDirectory (Join-Path $staging "bin") -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($gui.HasExited) {
            if ($gui.ExitCode -ne 0) {
              throw "sattool-ui.exe exited with code $($gui.ExitCode) during release smoke test"
            }
          } else {
            Stop-Process -Id $gui.Id
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$staging\*" -DestinationPath dist\SatTool-V0.0.1-Windows-x64-portable.zip -Force

      - name: Build NSIS installer
        shell: pwsh
        run: |
          cpack --config build\CPackConfig.cmake -C Release -G NSIS -B dist
          if (!(Get-ChildItem dist\*.exe -ErrorAction SilentlyContinue)) { throw "NSIS installer missing" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sattool-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;30.0.3'

      - name: Install Android NDK with retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sdkmanager 'ndk;25.2.9519653'; then
              test -d "$ANDROID_SDK_ROOT/ndk/25.2.9519653"
              exit 0
            fi
            echo "NDK install attempt $attempt failed; removing the partial archive before retrying"
            rm -rf "$ANDROID_SDK_ROOT/ndk/25.2.9519653" "$ANDROID_SDK_ROOT/.temp"
            sleep $((attempt * 5))
          done
          echo 'FATAL: Android NDK 25.2.9519653 could not be installed after 3 attempts'
          exit 1

      - name: Install Gradle 7.6.4 (no wrapper in this repo)
        run: |
          mkdir -p "$RUNNER_TEMP/gradle"
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "PATH=$RUNNER_TEMP/gradle/gradle-7.6.4/bin:$PATH" >> "$GITHUB_ENV"

      - name: Configure SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build native dependencies (android/deps)
        run: |
          git submodule update --init --recursive android/deps
          sudo apt-get install -y python3 python3-pip
          pip3 install mako
          # The upstream deps script clones R1NC/sqlite which no longer exists.
          # Provide the sqlite3 amalgamation with a small CMake wrapper instead.
          mkdir -p android/deps/sqlite
          curl -fsSL https://www.sqlite.org/2023/sqlite-amalgamation-3430000.zip -o /tmp/sqlite.zip
          python3 -m zipfile -e /tmp/sqlite.zip android/deps/sqlite
          mv android/deps/sqlite/sqlite-amalgamation-3430000/* android/deps/sqlite/
          rmdir android/deps/sqlite/sqlite-amalgamation-3430000
          cat > android/deps/sqlite/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.12)
          project(sqlite3 C)
          add_library(sqlite3 STATIC sqlite3.c)
          target_include_directories(sqlite3 PUBLIC ${CMAKE_CURRENT_SOURCE_DIR})
          install(TARGETS sqlite3 ARCHIVE DESTINATION lib)
          install(FILES sqlite3.h sqlite3ext.h DESTINATION include)
          EOF
          cd android/deps
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          sh build.sh
          for f in libvolk.a libsqlite3.a libfftw3f.a libz.a libpng.a libzstd.a libtiff.a libcurl.a libnng.a libwolfssl.a libcpu_features.a; do
            test -f output/arm64-v8a/lib/$f || { echo "FATAL: android/deps build did not produce $f"; ls output/arm64-v8a/lib/; exit 1; }
          done

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          aapt dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.sattool.app' versionCode='1' versionName='0.0.1'"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/resources/i18n/zh_CN/LC_MESSAGES/sattool.mo'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/resources/fonts/NotoSansSC-Regular.otf'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libfirstparty_support.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libfirstparty_loader_support.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libbitview_app.so'
          for plugin in \
            airspy_sdr_support airspyhf_sdr_support hydrasdr_sdr_support \
            hackrf_sdr_support limesdr_sdr_support plutosdr_sdr_support \
            rtlsdr_sdr_support mirisdr_sdr_support net_source_support \
            remote_sdr_support rtltcp_support spyserver_support sdrpp_server_support; do
            unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/arm64-v8a/lib${plugin}.so" || {
              echo "FATAL: Android SDR plugin is missing from APK: lib${plugin}.so"
              exit 1
            }
          done
          cp android/app/build/outputs/apk/debug/app-debug.apk SatTool-V0.0.1-Android-arm64.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: sattool-android
          path: SatTool-V0.0.1-Android-arm64.apk
          if-no-files-found: error
          retention-days: 30
