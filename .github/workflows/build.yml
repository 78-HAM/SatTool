name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Update apt cache (with retries for transient repository errors)
        run: |
          sudo apt-get update || (sleep 15 && sudo apt-get update) || (sleep 30 && sudo apt-get update)

      - name: Install dependencies
        run: |
          sudo apt-get install -y git build-essential cmake g++ pkgconf libfftw3-dev libpng-dev \
            libtiff-dev libjemalloc-dev libcurl4-openssl-dev libvolk-dev libnng-dev \
            libglfw3-dev zenity portaudio19-dev libzstd-dev libhdf5-dev librtlsdr-dev \
            libhackrf-dev libairspy-dev libairspyhf-dev libad9361-dev libiio-dev \
            libbladerf-dev libomp-dev ocl-icd-opencl-dev libdbus-1-dev libarmadillo-dev \
            libsqlite3-dev liblimesuite-dev libuhd-dev libxrandr-dev gettext python3

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DENABLE_I18N=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify i18n catalogs are up-to-date
        run: |
          msgfmt --check resources/i18n/zh_CN/LC_MESSAGES/zh_CN.po -o /dev/null
          python3 tools/gen_zh_i18n.py
          git diff --exit-code -- resources/i18n/zh_CN || (echo "zh_CN catalogs are out of date! Run: python3 tools/gen_zh_i18n.py" && exit 1)

      - name: Run UI and i18n regression tests
        run: |
          g++ -std=c++17 -Isrc-core src-testing/ui_regression_tests.cpp -o /tmp/ui_regression_tests
          /tmp/ui_regression_tests
          g++ -std=c++17 -D__ANDROID__ -Isrc-core \
            src-testing/i18n_switch_test.cpp src-core/libs/libintl-tiny/libintl.cpp \
            -o /tmp/i18n_switch_test
          /tmp/i18n_switch_test
          g++ -std=c++17 -Isrc-core src-testing/cjk_font_test.cpp \
            src-core/imgui/imgui.cpp src-core/imgui/imgui_draw.cpp \
            src-core/imgui/imgui_tables.cpp src-core/imgui/imgui_widgets.cpp \
            -o /tmp/cjk_font_test
          /tmp/cjk_font_test

      - name: Package install tree and DEB
        run: |
          staging="$RUNNER_TEMP/sattool-linux"
          cmake --install build --config Release --prefix "$staging/usr" > /tmp/install.log 2>&1 || { tail -50 /tmp/install.log; exit 1; }
          test -x "$staging/usr/bin/satdump-ui"
          test -x "$staging/usr/bin/satdump"
          test -f "$staging/usr/share/satdump/satdump_cfg.json"
          test -f "$staging/usr/share/satdump/resources/i18n/zh_CN/LC_MESSAGES/satdump.mo"
          test -f "$staging/usr/share/satdump/resources/fonts/NotoSansSC-Regular.otf"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf dist/sattool-linux-install-tree.tar.gz sattool-linux
          cmake --build build --target package -j$(nproc)
          find build -maxdepth 1 -type f -name '*.deb' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: sattool-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Clone vcpkg (latest, avoids stale msys2 mirror URLs in old registries)
        run: git clone --depth 1 https://github.com/microsoft/vcpkg

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies
        # Core-only package list from windows/Configure-vcpkg.ps1 (+ volk).
        # SDR-specific dependencies are skipped, the matching plugins are disabled below.
        run: .\vcpkg\vcpkg install --triplet x64-windows pthreads libjpeg-turbo tiff libpng glfw3 libusb fftw3 libxml2 portaudio nng zstd opencl curl hdf5[cpp,hl] sqlite3

      - name: Build VOLK from source (vcpkg's volk port is the Vulkan loader)
        run: |
          pip install mako
          git clone --depth 1 --recurse-submodules https://github.com/JVital2013/volk -b win-arm64
          cmake -S volk -B volk-build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows" -DENABLE_TESTING=OFF -DENABLE_MODTOOL=OFF
          cmake --build volk-build --config Release
          cmake --install volk-build --config Release

      - name: Configure CMake
        run: >
          cmake -B build
          -DBUILD_MSVC=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -A x64
          -DBUILD_GUI=ON
          -DENABLE_I18N=ON
          -DPLUGINS_ALL=OFF
          -DPLUGIN_XRIT=ON
          -DPLUGIN_FIRSTPARTY_SUPPORT=ON
          -DPLUGIN_BITVIEW_APP=ON
          -DPLUGIN_AIRSPY_SDR_SUPPORT=OFF
          -DPLUGIN_HYDRASDR_SDR_SUPPORT=OFF
          -DPLUGIN_AIRSPYHF_SDR_SUPPORT=OFF
          -DPLUGIN_HACKRF_SDR_SUPPORT=OFF
          -DPLUGIN_LIMESDR_SDR_SUPPORT=OFF
          -DPLUGIN_SDRPLAY_SDR_SUPPORT=OFF
          -DPLUGIN_PLUTOSDR_SDR_SUPPORT=OFF
          -DPLUGIN_BLADERF_SDR_SUPPORT=OFF
          -DPLUGIN_LITEXM2SDR_SDR_SUPPORT=OFF
          -DPLUGIN_USRP_SDR_SUPPORT=OFF
          -DPLUGIN_RTLSDR_SDR_SUPPORT=OFF
          -DPLUGIN_MIRISDR_SDR_SUPPORT=OFF
          -DPLUGIN_SPYSERVER_SUPPORT=OFF
          -DPLUGIN_RTLTCP_SUPPORT=OFF
          -DPLUGIN_SDRPP_SERVER_SUPPORT=OFF
          -DPLUGIN_AARONIA_SDR_SUPPORT=OFF
          -DPLUGIN_HAROGIC_SDR_SUPPORT=OFF
          -DPLUGIN_RFNM_SDR_SUPPORT=OFF
          -DPLUGIN_FOBOSSDR_SDR_SUPPORT=OFF
          -DPLUGIN_RTAUDIO_SDR_SUPPORT=OFF
          -DPLUGIN_NET_SOURCE_SDR_SUPPORT=OFF
          -DPLUGIN_REMOTE_SDR_SUPPORT=OFF
          -DPLUGIN_SDDC_SDR_SUPPORT=OFF
          -DPLUGIN_SOAPY_SDR_SUPPORT=OFF
          -DPLUGIN_BOCHUM_SUPPORT=OFF
          -DPLUGIN_EXPERIMENTAL_DEVICES_SUPPORT=OFF
          -DPLUGIN_RTAUDIO_SINK=OFF
          -DPLUGIN_PORTAUDIO_SINK=OFF
          -DPLUGIN_AAUDIO_SINK=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Stage and verify Windows release
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "sattool-windows"
          cmake --install build --config Release --prefix $staging

          $required = @(
            "bin\satdump-ui.exe",
            "bin\satdump.exe",
            "share\satdump\satdump_cfg.json",
            "share\satdump\resources\i18n\zh_CN\LC_MESSAGES\satdump.mo",
            "share\satdump\resources\fonts\NotoSansSC-Regular.otf",
            "lib\satdump\plugins\xrit_support.dll",
            "lib\satdump\plugins\firstparty_support.dll",
            "lib\satdump\plugins\firstparty_loader_support.dll",
            "lib\satdump\plugins\bitview_app.dll"
          )
          foreach ($path in $required) {
            if (!(Test-Path (Join-Path $staging $path))) { throw "Installed file missing: $path" }
          }

          Push-Location $env:RUNNER_TEMP
          try {
            & (Join-Path $staging "bin\satdump.exe") --help
            if ($LASTEXITCODE -ne 0) { throw "Installed satdump.exe smoke test failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $gui = Start-Process (Join-Path $staging "bin\satdump-ui.exe") -WorkingDirectory (Join-Path $staging "bin") -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($gui.HasExited) {
            if ($gui.ExitCode -ne 0) { throw "Installed satdump-ui.exe smoke test failed with exit code $($gui.ExitCode)" }
          } else {
            Stop-Process -Id $gui.Id
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$staging\*" -DestinationPath dist\sattool-windows-portable.zip -Force

      - name: Build NSIS installer
        shell: pwsh
        run: |
          cpack --config build\CPackConfig.cmake -C Release -G NSIS -B dist
          if (!(Get-ChildItem dist\*.exe -ErrorAction SilentlyContinue)) { throw "NSIS installer missing" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sattool-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;30.0.3 ndk;25.2.9519653'

      - name: Install Gradle 7.6.4 (no wrapper in this repo)
        run: |
          mkdir -p "$RUNNER_TEMP/gradle"
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "PATH=$RUNNER_TEMP/gradle/gradle-7.6.4/bin:$PATH" >> "$GITHUB_ENV"

      - name: Configure SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build native dependencies (android/deps)
        run: |
          git submodule update --init --recursive android/deps
          sudo apt-get install -y python3 python3-pip
          pip3 install mako
          # The upstream deps script clones R1NC/sqlite which no longer exists.
          # Provide the sqlite3 amalgamation with a small CMake wrapper instead.
          mkdir -p android/deps/sqlite
          curl -fsSL https://www.sqlite.org/2023/sqlite-amalgamation-3430000.zip -o /tmp/sqlite.zip
          python3 -m zipfile -e /tmp/sqlite.zip android/deps/sqlite
          mv android/deps/sqlite/sqlite-amalgamation-3430000/* android/deps/sqlite/
          rmdir android/deps/sqlite/sqlite-amalgamation-3430000
          cat > android/deps/sqlite/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.12)
          project(sqlite3 C)
          add_library(sqlite3 STATIC sqlite3.c)
          target_include_directories(sqlite3 PUBLIC ${CMAKE_CURRENT_SOURCE_DIR})
          install(TARGETS sqlite3 ARCHIVE DESTINATION lib)
          install(FILES sqlite3.h sqlite3ext.h DESTINATION include)
          EOF
          cd android/deps
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          sh build.sh
          for f in libvolk.a libsqlite3.a libfftw3f.a libz.a libpng.a libzstd.a libtiff.a libcurl.a libnng.a libwolfssl.a libcpu_features.a; do
            test -f output/arm64-v8a/lib/$f || { echo "FATAL: android/deps build did not produce $f"; ls output/arm64-v8a/lib/; exit 1; }
          done

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/resources/i18n/zh_CN/LC_MESSAGES/satdump.mo'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/resources/fonts/NotoSansSC-Regular.otf'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libfirstparty_support.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libfirstparty_loader_support.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libbitview_app.so'
          cp android/app/build/outputs/apk/debug/app-debug.apk sattool-android-debug.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: sattool-android-debug
          path: sattool-android-debug.apk
          if-no-files-found: error
          retention-days: 30
